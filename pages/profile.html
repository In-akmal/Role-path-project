<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — RolePath</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .profile-layout{ display:grid; grid-template-columns: 300px 1fr; gap:28px; align-items:flex-start; }
  .profile-avatar{
    width:96px; height:96px; border-radius:50%;
    background: var(--grad-path); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-size:34px; font-weight:800;
    margin: 0 auto 16px;
  }
  .profile-stat-row{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .profile-stat-row:last-child{ border-bottom:none; }
  .profile-avatar-wrap:hover .avatar-edit-overlay { opacity: 1 !important; }
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M5 8v3a4 4 0 0 0 4 4h6a4 4 0 0 1 4 3"/></svg></span>
      RolePath
    </a>
    <nav class="nav-links" data-nav-links>
      <a href="../index.html" data-nav="index.html">Home</a>
      <a href="roadmaps.html" data-nav="roadmaps.html">Roadmaps</a>
      <a href="dashboard.html" data-nav="dashboard.html" data-auth-only>Dashboard</a>
      <a href="my-roadmaps.html" data-nav="my-roadmaps.html" data-auth-only>My Roadmaps</a>
      <a href="profile.html" data-nav="profile.html" class="active" data-auth-only>Profile</a>
      <a href="login.html" class="mobile-only-cta" data-guest-only>Login</a>
      <a href="register.html" class="mobile-only-cta" data-guest-only>Register</a>
      <a href="#" data-logout data-auth-only class="mobile-only-cta">Logout</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <a href="login.html" class="btn btn-secondary btn-sm" data-guest-only>Login</a>
      <a href="register.html" class="btn btn-primary btn-sm" data-guest-only>Register</a>
      <a href="profile.html" class="avatar-btn" data-auth-only style="display:none"><span data-user-initial>U</span></a>
      <button class="nav-toggle" data-nav-toggle aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="section-tight">
  <div class="container">
    <div id="guestNotice" class="empty-state" style="display:none;">
      <h3>You're not logged in</h3>
      <p>Log in to view and edit your profile.</p>
      <a href="login.html" class="btn btn-primary">Log In</a>
    </div>

    <div id="pageContent">
      <div class="section-head reveal in">
        <span class="eyebrow">Account</span>
        <h1 style="font-size:clamp(26px,4vw,34px);">Profile</h1>
      </div>

      <div class="profile-layout reveal in">
        <div class="card text-center">
          <div class="profile-avatar-wrap" id="avatarWrap" style="position:relative; cursor:pointer; width:96px; height:96px; margin: 0 auto 16px;" title="Click to upload profile picture">
            <div class="profile-avatar" id="avatarInitial" style="margin:0; width:96px; height:96px; font-size:34px; flex-shrink:0; background-size:cover; background-position:center;">U</div>
            <div class="avatar-edit-overlay" style="position:absolute; inset:0; background:rgba(0,0,0,0.5); border-radius:50%; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.2s;">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="24" height="24" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
            <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
          </div>
          <h3 id="profileName">—</h3>
          <p class="muted" id="profileEmail" style="font-size:13px;">—</p>
          <button class="btn btn-secondary btn-block mt-24" id="editBtn">Edit Profile</button>
          <button class="btn btn-ghost btn-block mt-8" data-logout>Logout</button>
        </div>

        <div>
          <div class="card stagger-in">
            <strong style="font-size:14px;">Gamification Stats</strong>
            <div class="mt-16" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;" id="profileStatsGrid">
              <!-- JS will populate -->
            </div>
          </div>

          <div class="card mt-16 animate-in" style="animation-delay:0.2s">
            <strong style="font-size:14px;">Achievement Badges</strong>
            <div class="badge-grid mt-16" id="profileBadgeGrid"></div>
          </div>

          <form class="form-card mt-16" id="editForm" style="display:none;">
            <div class="form-group">
              <label for="editName">Full name</label>
              <input class="form-control" id="editName">
            </div>
            <div class="form-group">
              <label for="editEmail">Email</label>
              <input class="form-control" id="editEmail" type="email">
            </div>
            <button class="btn btn-primary" type="submit">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom" style="border-top:none; padding-top:0;">
    <span>© 2026 RolePath. All rights reserved.</span>
    <div class="footer-bottom-links"><a href="#">Privacy</a><a href="#">Terms</a></div>
  </div>
</footer>

<script src="../js/script.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if(!RP.api.isLoggedIn()){
      document.getElementById("guestNotice").style.display = "block";
      document.getElementById("pageContent").style.display = "none";
      return;
    }
    const user = RP.api.currentUser();
    const avatarInitial = document.getElementById("avatarInitial");
    if(user.avatar) {
      avatarInitial.textContent = "";
      avatarInitial.style.backgroundImage = `url(${user.avatar})`;
    } else {
      avatarInitial.textContent = user.name.charAt(0).toUpperCase();
      avatarInitial.style.backgroundImage = 'none';
    }

    // Avatar upload logic
    const avatarWrap = document.getElementById("avatarWrap");
    const avatarUpload = document.getElementById("avatarUpload");
    if(avatarWrap && avatarUpload){
      avatarWrap.addEventListener("click", () => avatarUpload.click());
      avatarUpload.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          avatarInitial.textContent = "";
          avatarInitial.style.backgroundImage = `url(${dataUrl})`;
          RP.api.updateAvatar(dataUrl);
          RP.showToast("Profile picture updated");
          document.querySelectorAll('.avatar-btn').forEach(btn => {
             btn.innerHTML = "";
             btn.style.backgroundImage = `url(${dataUrl})`;
             btn.style.backgroundSize = "cover";
             btn.style.backgroundPosition = "center";
          });
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("profileName").textContent = user.name;
    document.getElementById("profileEmail").textContent = user.email;
    document.getElementById("editName").value = user.name;
    document.getElementById("editEmail").value = user.email;

    const levelInfo = RP.api.getLevelProgress();
    const streak = RP.api.getStreak();
    const xpInfo = RP.api.getXP();
    const totalTopics = RP.api.getTotalTopicsDone();
    
    document.getElementById("profileStatsGrid").innerHTML = `
      <div class="stat-card-v2" style="padding:14px;">
        <div class="stat-label">Level</div>
        <div class="stat-value" style="font-size:22px;">${levelInfo.level}</div>
      </div>
      <div class="stat-card-v2" style="padding:14px;">
        <div class="stat-label">Total XP</div>
        <div class="stat-value" style="font-size:22px;">${xpInfo.total}</div>
      </div>
      <div class="stat-card-v2" style="padding:14px;">
        <div class="stat-label">Longest Streak</div>
        <div class="stat-value" style="font-size:22px;">${streak.longest} <span style="font-size:12px; font-weight:normal; color:var(--text-muted)">Days</span></div>
      </div>
      <div class="stat-card-v2" style="padding:14px;">
        <div class="stat-label">Topics Done</div>
        <div class="stat-value" style="font-size:22px;">${totalTopics}</div>
      </div>
    `;

    const badgeGrid = document.getElementById("profileBadgeGrid");
    const earnedBadges = RP.api.getBadges();
    const allBadges = RP.api.getBadgeDefs();
    
    badgeGrid.innerHTML = allBadges.map((b, i) => {
      const earned = earnedBadges.includes(b.id);
      return `
        <div class="badge-achievement ${!earned ? 'locked' : ''}">
          <div class="badge-emoji">${b.emoji}</div>
          <div class="badge-title">${b.title}</div>
        </div>
      `;
    }).join("");

    document.getElementById("editBtn").addEventListener("click", () => {
      const form = document.getElementById("editForm");
      form.style.display = form.style.display === "none" ? "block" : "none";
    });

    document.getElementById("editForm").addEventListener("submit", (e) => {
      e.preventDefault();
      RP.api.register(document.getElementById("editName").value, document.getElementById("editEmail").value);
      RP.showToast("Profile updated");
      document.getElementById("profileName").textContent = document.getElementById("editName").value;
      document.getElementById("profileEmail").textContent = document.getElementById("editEmail").value;
      
      const user = RP.api.currentUser();
      if(!user.avatar) {
        document.getElementById("avatarInitial").textContent = document.getElementById("editName").value.charAt(0).toUpperCase();
      }
    });
  });
</script>
</body>
</html>
