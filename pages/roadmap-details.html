    <a href="../index.html" class="brand">

      <a href="#" data-logout data-auth-only class="mobile-only-cta">Logout</a>
    </nav>
    <div class="nav-actions">
      <!-- Sound toggle — small inline button, not polluting the nav -->
      <button class="theme-toggle" id="soundToggleBtn" aria-label="Toggle sound" title="Toggle sound effects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
      </button>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>

      <a href="register.html" class="btn btn-primary btn-sm" data-guest-only>Get Started</a>
      <a href="dashboard.html" class="avatar-btn" data-auth-only style="display:none" aria-label="Open dashboard"><span data-user-initial>U</span></a>
      <button class="nav-toggle" data-nav-toggle aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main>

  <!-- Roadmap Header -->
  <section class="catalogue-hero">
    <div class="container" style="max-width:1040px;">
      <a href="roadmaps.html" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--color-text-muted); margin-bottom:16px; text-decoration:none; transition:color 0.15s;" onmouseover="this.style.color='var(--color-text)'" onmouseout="this.style.color='var(--color-text-muted)'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px;" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        All Roadmaps
      </a>
      <h1 id="rdName" class="hero-title">Loading roadmap…</h1>
      <p class="hero-subtitle" id="rdDesc" style="margin-top:8px;"></p>
    </div>
  </section>

  <!-- Content + Sidebar -->
  <section style="padding-bottom:120px;">
    <div class="container rd-layout" style="max-width:1040px;">

      <div class="main-content" role="region" aria-label="Roadmap lessons">
        <div id="topicList"></div>
      </div>

      <aside class="sidebar-minimal" id="sidebarContainer" aria-label="Progress sidebar">
        <!-- Rendered by sidebar-renderer.js -->
      </aside>

    </div>
  </section>

</main>

<!-- ============================== FOOTER ============================== -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Services & App -->
<script src="../js/services/sound-service.js"></script>
<script type="module" src="../js/app.js"></script>
<script>
  // Sound toggle
  const soundBtn = document.getElementById('soundToggleBtn');
  if (soundBtn) {
    soundBtn.addEventListener('click', () => {
      const isEnabled = window.RPSound && window.RPSound.toggle();
      updateSoundIcon(isEnabled);
    });

    function updateSoundIcon(enabled) {
      const svg = soundBtn.querySelector('svg');
      if (!svg) return;
      if (enabled) {
        svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
        soundBtn.setAttribute('aria-label', 'Mute sounds');
      } else {
        svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
        soundBtn.setAttribute('aria-label', 'Enable sounds');
      }
    }

    // Initial state
    updateSoundIcon(localStorage.getItem('rp_sound_enabled') !== 'false');
  }
</script>

</body>
</html>
