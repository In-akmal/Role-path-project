<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — RolePath</title>
<meta name="description" content="Create your free RolePath account and start tracking your learning progress across career roadmaps.">
<link rel="stylesheet" href="../css/design-tokens.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<!-- ============================== NAVBAR ============================== -->
<header class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M5 8v3a4 4 0 0 0 4 4h6a4 4 0 0 1 4 3"/></svg></span>
      RolePath
    </a>
    <nav class="nav-links" data-nav-links aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="roadmaps.html">Roadmaps</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
      <button class="nav-toggle" data-nav-toggle aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main style="min-height:calc(100vh - var(--nav-height) - 80px); display:flex; align-items:center;">
  <div class="container" style="max-width:420px; padding-top:40px; padding-bottom:40px;">

    <div class="text-center" style="margin-bottom:32px;">
      <h1 style="font-size:28px;">Create your account</h1>
      <p class="muted" style="margin-top:8px; font-size:15px;">Track progress across every roadmap you start — free.</p>
    </div>

    <form class="form-card" id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">Full name</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input type="text" id="name" name="name" class="form-control" placeholder="Priya Sharma" required autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 6l-10 7L2 6"/><path d="M2 6h20v12H2z"/></svg>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>
        <p class="form-error" id="emailError" role="alert">Enter a valid email address.</p>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <p class="form-error" id="passwordError" role="alert">Password must be at least 6 characters.</p>
      </div>

      <div style="margin-bottom:20px;">
        <label class="checkbox-row">
          <input type="checkbox" id="terms" name="terms" required>
          I agree to the <a href="#" style="color:var(--color-primary);">Terms</a> and <a href="#" style="color:var(--color-primary);">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Free Account</button>

      <p class="text-center muted" style="font-size:13px; margin-top:20px;">
        Already have an account? <a href="login.html" style="color:var(--color-primary); font-weight:600;">Log in</a>
      </p>
    </form>

  </div>
</main>

<!-- ============================== FOOTER ============================== -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <span class="footer-copy">© 2026 RolePath. All rights reserved.</span>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </nav>
    </div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../js/script.js?v=6"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const name     = document.getElementById("name");
    const email    = document.getElementById("email");
    const password = document.getElementById("password");
    const terms    = document.getElementById("terms");
    let valid = true;

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
    document.getElementById("emailError").style.display = emailOk ? "none" : "block";
    if (!emailOk) valid = false;

    const passOk = password.value.length >= 6;
    document.getElementById("passwordError").style.display = passOk ? "none" : "block";
    if (!passOk) valid = false;

    if (!terms.checked) {
      RP.showToast("Please accept the Terms and Privacy Policy.");
      valid = false;
    }

    if (!valid) return;

    const btn = document.getElementById("registerBtn");
    btn.disabled = true;
    btn.textContent = "Creating account…";

    RP.api.register(name.value, email.value);
    RP.showToast("Account created — welcome to RolePath!");
    setTimeout(() => window.location.href = "dashboard.html", 600);
  });
</script>
</body>
</html>
