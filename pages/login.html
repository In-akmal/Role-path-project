<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RolePath</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M5 8v3a4 4 0 0 0 4 4h6a4 4 0 0 1 4 3"/></svg></span>
      RolePath
    </a>
    <nav class="nav-links" data-nav-links>
      <a href="../index.html">Home</a>
      <a href="roadmaps.html">Roadmaps</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <a href="register.html" class="btn btn-secondary btn-sm">Register</a>
      <button class="nav-toggle" data-nav-toggle aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="section" style="min-height:calc(100vh - var(--nav-height) - 200px); display:flex; align-items:center;">
  <div class="container" style="max-width:440px;">
    <div class="text-center reveal in" style="margin-bottom:28px;">
      <span class="eyebrow">Welcome back</span>
      <h1 style="font-size:30px;">Log in to RolePath</h1>
      <p class="muted mt-8">Continue exactly where you left off.</p>
    </div>

    <form class="form-card reveal in" id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 6l-10 7L2 6"/><path d="M2 6h20v12H2z"/></svg>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <p class="form-error" id="emailError">Enter a valid email address.</p>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
        </div>
        <p class="form-error" id="passwordError">Password must be at least 6 characters.</p>
      </div>

      <div class="flex justify-between items-center mt-16" style="margin-bottom: 8px;">
        <label class="checkbox-row"><input type="checkbox"> Remember me</label>
        <a href="#" class="muted" style="font-size:13px;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-16">Log In</button>

      <div class="divider-text">or continue with</div>
      <div class="social-row">
        <button type="button" class="social-btn" onclick="RP.showToast('Google login coming soon')">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.6a4.8 4.8 0 0 1-2.1 3.2v2.6h3.4c2-1.8 3.1-4.6 3.1-7.7z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.2 13.6a6 6 0 0 1 0-3.8V7.1H2.7a10 10 0 0 0 0 9l3.5-2.5z"/><path fill="#EA4335" d="M12 6.6c1.5 0 2.9.5 4 1.5l3-3A10 10 0 0 0 2.7 7.1l3.5 2.6c.8-2.5 3.1-4.3 5.8-4.3z"/></svg>
          Google
        </button>
        <button type="button" class="social-btn" onclick="RP.showToast('GitHub login coming soon')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5a4 4 0 0 1 1.1-2.8 3.7 3.7 0 0 1 .1-2.8s.9-.3 3 1.1a10.4 10.4 0 0 1 5.4 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.5.1 2.8a4 4 0 0 1 1.1 2.8c0 3.9-2.4 4.7-4.6 5 .3.3.6.9.6 1.8V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>
          GitHub
        </button>
      </div>

      <p class="text-center mt-24 muted" style="font-size:14px;">
        Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600;">Register</a>
      </p>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom" style="border-top:none; padding-top:0;">
    <span>© 2026 RolePath. All rights reserved.</span>
    <div class="footer-bottom-links"><a href="#">Privacy</a><a href="#">Terms</a></div>
  </div>
</footer>

<script src="../js/script.js?v=5"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    let valid = true;
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
    document.getElementById("emailError").style.display = emailOk ? "none" : "block";
    if(!emailOk) valid = false;
    const passOk = password.value.length >= 6;
    document.getElementById("passwordError").style.display = passOk ? "none" : "block";
    if(!passOk) valid = false;
    if(!valid) return;

    RP.api.login(email.value);
    RP.showToast("Welcome back!");
    setTimeout(() => window.location.href = "dashboard.html", 600);
  });
</script>
</body>
</html>
