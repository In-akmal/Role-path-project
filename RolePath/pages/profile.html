<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="RolePath structured career roadmaps"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><title>Profile | RolePath</title></head><body><div id="siteNav"></div><main><section class="page-head"><div class="container"><span class="eyebrow">ACCOUNT</span><h1>Your Profile</h1><p>Manage your basic RolePath profile.</p><div class="profile-grid" style="margin-top:28px"><aside class="card center"><div class="profile-photo" id="initials">MS</div><h2 id="profileName">Madhu Sudan</h2><p class="muted" id="profileEmail">madhu@example.com</p><button class="btn btn-secondary full" onclick="location.href='login.html'">Logout</button></aside><div class="card"><h2>Profile Details</h2><form id="profileForm"><div class="form-group"><label>Full Name</label><input class="input" id="name"></div><div class="form-group"><label>Email</label><input class="input" id="email" type="email"></div><button class="btn btn-primary">Save Changes</button></form><div class="stats"><div class="stat"><strong id="purchased">0</strong><span>Premium</span></div><div class="stat"><strong id="freeCount">0</strong><span>Free Started</span></div><div class="stat"><strong id="profileProgress">0%</strong><span>Progress</span></div></div></div></div></div></section></main><div id="siteFooter"></div><script src="../js/script.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let u=Store.user(),rs=ROADMAPS.filter(r=>Store.enrolled().includes(r.id));const fill=()=>{profileName.textContent=u.name;profileEmail.textContent=u.email;name.value=u.name;email.value=u.email;initials.textContent=u.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();purchased.textContent=rs.filter(r=>!r.free).length;freeCount.textContent=rs.filter(r=>r.free).length;profileProgress.textContent=(rs.length?Math.round(rs.reduce((s,r)=>s+percent(r),0)/rs.length):0)+'%'};profileForm.onsubmit=e=>{e.preventDefault();u={name:name.value,email:email.value};Store.set('rolepathUser',u);fill();alert('Profile updated in this frontend demo.')};fill()})</script></body></html>
