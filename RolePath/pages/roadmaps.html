<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="RolePath structured career roadmaps"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><title>Roadmaps | RolePath</title></head><body><div id="siteNav"></div><main><section class="page-head"><div class="container"><span class="eyebrow">CAREER PATHS</span><h1>Find your roadmap</h1><p>Free basics and complete 1-year career roadmaps.</p><div class="search-box" style="margin-top:24px"><input id="search" placeholder="Search Java, Python, Civil, AI..."><button class="btn btn-primary">Search</button></div><div class="filters" id="filters"></div><div class="grid" id="roadmapGrid"></div></div></section></main><div id="siteFooter"></div><script src="../js/script.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const cats=['All',...new Set(ROADMAPS.map(r=>r.category))];const f=document.getElementById('filters'),g=document.getElementById('roadmapGrid'),s=document.getElementById('search');let active='All';f.innerHTML=cats.map((c,i)=>`<button class="filter-btn ${i===0?'active':''}" data-c="${c}">${c}</button>`).join('');function render(){const q=s.value.toLowerCase();g.innerHTML=ROADMAPS.filter(r=>(active==='All'||r.category===active)&&r.name.toLowerCase().includes(q)).map(card).join('')||'<div class="empty">No roadmaps found.</div>'}f.onclick=e=>{if(!e.target.dataset.c)return;active=e.target.dataset.c;document.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===e.target));render()};s.oninput=render;const q=new URLSearchParams(location.search).get('q');if(q)s.value=q;render()})</script></body></html>
