<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="RolePath structured career roadmaps"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><title>Register | RolePath</title></head><body><div id="siteNav"></div><main><section class="auth-wrap"><div class="auth-card"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p>Start tracking a clear career path.</p><form onsubmit="event.preventDefault();localStorage.setItem('rolepathUser',JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value}));location.href='roadmaps.html'"><div class="form-group"><label>Full Name</label><input class="input" id="name" required placeholder="Your full name"></div><div class="form-group"><label>Email</label><input class="input" id="email" type="email" required placeholder="you@example.com"></div><div class="form-group"><label>Password</label><input class="input" type="password" required placeholder="Create password"></div><div class="form-group"><label>Confirm Password</label><input class="input" type="password" required placeholder="Confirm password"></div><button class="btn btn-primary full">Create Account</button></form><div class="divider">or</div><button class="btn btn-secondary full" onclick="location.href='roadmaps.html'">G&nbsp; Sign up with Google</button><div class="auth-foot">Already have an account? <a style="color:var(--primary);font-weight:700" href="login.html">Login</a></div></div></section></main><div id="siteFooter"></div><script src="../js/script.js"></script></body></html>
