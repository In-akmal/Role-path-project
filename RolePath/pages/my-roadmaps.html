<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="RolePath structured career roadmaps"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><title>My Roadmaps | RolePath</title></head><body><div id="siteNav"></div><main><section class="page-head"><div class="container"><span class="eyebrow">MY LEARNING</span><h1>My Roadmaps</h1><p>Free roadmaps you started and premium roadmaps you unlocked.</p><div class="grid" id="myGrid" style="margin-top:28px"></div></div></section></main><div id="siteFooter"></div><script src="../js/script.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const a=Store.enrolled(),rs=ROADMAPS.filter(r=>a.includes(r.id)),g=document.getElementById('myGrid');g.innerHTML=rs.length?rs.map(r=>`<article class="card"><div class="roadmap-icon">${r.icon}</div><h3>${r.name}</h3><p>${r.desc}</p><div class="progress"><div class="progress-fill" style="width:${percent(r)}%"></div></div><p><strong>${percent(r)}%</strong> complete</p><a class="btn btn-primary full" href="roadmap-details.html?id=${r.id}">Continue Learning</a></article>`).join(''):'<div class="empty">You have not started a roadmap yet. <a href="roadmaps.html" style="color:var(--primary)">Explore roadmaps</a>.</div>'})</script></body></html>
