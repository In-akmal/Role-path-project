<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — RolePath</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
  .pay-card{ max-width: 460px; margin: 0 auto; }
  .pay-summary{ display:flex; align-items:center; gap:14px; padding-bottom:20px; margin-bottom:20px; border-bottom:1px solid var(--border); }
  .pay-summary .thumb{ width:52px; height:52px; border-radius:12px; background:var(--grad-primary); flex-shrink:0; }
  .pay-row{ display:flex; justify-content:space-between; font-size:14px; padding:8px 0; }
  .pay-row.total{ font-weight:700; font-size:16px; border-top:1px solid var(--border); padding-top:14px; margin-top:6px; }
  .pay-method{ display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--border); border-radius: var(--radius); margin-bottom:10px; cursor:pointer; transition: border-color .18s var(--ease); }
  .pay-method.selected{ border-color: var(--primary); background: var(--primary-50); }
  .pay-method input{ accent-color: var(--primary); width:16px; height:16px; }
  .razorpay-badge{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:12px; color:var(--text-faint); margin-top:20px; }
  .spinner{ width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation: spin .7s linear infinite; display:none; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M5 8v3a4 4 0 0 0 4 4h6a4 4 0 0 1 4 3"/></svg></span>
      RolePath
    </a>
    <nav class="nav-links" data-nav-links><a href="../index.html">Home</a><a href="roadmaps.html">Roadmaps</a></nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <button class="nav-toggle" data-nav-toggle aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="section">
  <div class="container pay-card">
    <div class="text-center reveal in" style="margin-bottom:24px;">
      <span class="eyebrow">Secure checkout</span>
      <h1 style="font-size:26px;">Complete your payment</h1>
    </div>

    <div class="card reveal in">
      <div class="pay-summary">
        <div class="thumb"></div>
        <div>
          <strong id="payName">Roadmap</strong>
          <div class="muted" style="font-size:12.5px;" id="payMeta">—</div>
        </div>
      </div>

      <div class="pay-row"><span class="muted">Roadmap price</span><span>₹29</span></div>
      <div class="pay-row"><span class="muted">Platform fee</span><span>₹0</span></div>
      <div class="pay-row total"><span>Total payable</span><span id="payTotal">₹29</span></div>

      <div class="mt-24">
        <div class="pay-method selected" data-method="upi">
          <input type="radio" name="method" checked> <span>UPI (Google Pay, PhonePe, Paytm)</span>
        </div>
        <div class="pay-method" data-method="card">
          <input type="radio" name="method"> <span>Credit / Debit Card</span>
        </div>
        <div class="pay-method" data-method="netbanking">
          <input type="radio" name="method"> <span>Net Banking</span>
        </div>
      </div>

      <button class="btn btn-primary btn-block mt-24" id="payNowBtn">
        <span class="spinner" id="paySpinner"></span>
        <span id="payBtnLabel">Pay Now — ₹29</span>
      </button>
      <a href="roadmap-details.html" class="btn btn-ghost btn-block mt-8" id="cancelBtn">Cancel</a>

      <div class="razorpay-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Secured by Razorpay (demo)
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom" style="border-top:none; padding-top:0;">
    <span>© 2026 RolePath. All rights reserved.</span>
    <div class="footer-bottom-links"><a href="#">Privacy</a><a href="#">Terms</a></div>
  </div>
</footer>

<script src="../js/script.js"></script>
<script src="../js/payment.js"></script>
</body>
</html>
