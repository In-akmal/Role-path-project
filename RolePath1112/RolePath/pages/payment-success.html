<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — RolePath</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
  .success-wrap{ max-width: 460px; margin: 0 auto; text-align:center; }
  .check-circle{
    width:96px; height:96px; border-radius:50%;
    background: var(--success-100);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 24px;
    animation: pop .5s var(--ease);
  }
  .check-circle svg{ width:44px; height:44px; stroke: var(--success); }
  .check-circle svg path{
    stroke-dasharray: 30; stroke-dashoffset: 30;
    animation: draw .5s var(--ease) .3s forwards;
  }
  @keyframes pop{ 0%{ transform: scale(0.4); opacity:0; } 100%{ transform: scale(1); opacity:1; } }
  @keyframes draw{ to{ stroke-dashoffset: 0; } }
  .unlocked-card{ display:flex; align-items:center; gap:14px; text-align:left; padding:16px; }
  .unlocked-card .thumb{ width:48px; height:48px; border-radius:12px; background:var(--grad-primary); flex-shrink:0; }
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M5 8v3a4 4 0 0 0 4 4h6a4 4 0 0 1 4 3"/></svg></span>
      RolePath
    </a>
    <nav class="nav-links" data-nav-links><a href="../index.html">Home</a><a href="roadmaps.html">Roadmaps</a></nav>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <button class="nav-toggle" data-nav-toggle aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="section" style="min-height:calc(100vh - var(--nav-height) - 200px); display:flex; align-items:center;">
  <div class="container success-wrap">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1 style="font-size:28px;">Payment Successful</h1>
    <p class="muted mt-8">Your roadmap has been unlocked and added to your dashboard.</p>

    <div class="card unlocked-card mt-24">
      <div class="thumb"></div>
      <div>
        <strong id="successName">Roadmap</strong>
        <div class="muted" style="font-size:12.5px;">Payment ID: <span id="paymentId">—</span></div>
      </div>
    </div>

    <a href="dashboard.html" class="btn btn-primary btn-block mt-24">Go To Dashboard</a>
    <a href="roadmap-details.html" id="startLink" class="btn btn-secondary btn-block mt-8">Start Learning Now</a>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom" style="border-top:none; padding-top:0;">
    <span>© 2026 RolePath. All rights reserved.</span>
    <div class="footer-bottom-links"><a href="#">Privacy</a><a href="#">Terms</a></div>
  </div>
</footer>

<script src="../js/script.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const roadmap = id ? RP.api.getRoadmap(id) : null;
  if(roadmap){
    document.getElementById("successName").textContent = roadmap.name;
    document.getElementById("startLink").href = "roadmap-details.html?id=" + id;
  }
  document.getElementById("paymentId").textContent = "pay_" + Math.random().toString(36).slice(2, 12).toUpperCase();
</script>
</body>
</html>
